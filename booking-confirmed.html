<!DOCTYPE html>
<html lang="en">

<head>
  <script>
    (function () {
      var allowed = ['cleanse.ng', 'vercel.app', 'localhost', '127.0.0.1', '::1'];
      var isLocal = window.location.protocol === 'file:';
      var host = window.location.hostname;
      var isAllowed = allowed.some(function (d) { return host === d || host.endsWith('.' + d); });
      if (isLocal || (host && !isAllowed)) {
        document.documentElement.style.display = 'none';
        window.location.href = 'https://cleanse.ng';
      }
    })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Booking Confirmed — Cleanse.ng</title>
  <meta name="description" content="Thank you for booking with Cleanse.ng! Your residential cleaning plan request has been received.">
  <meta name="robots" content="noindex, follow">
  
  <link rel="canonical" href="https://cleanse.ng/booking-confirmed.html">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&family=Nunito:ital,wght@0,300;0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./index.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
    .confirmed-page {
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--dark-purple, #0F0919);
      color: #fff;
      overflow: hidden;
    }
    nav.confirmed-nav {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 28px;
      width: 100%;
      z-index: 100;
      background: rgba(15, 9, 25, 0.9);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      box-sizing: border-box;
    }
    @media (max-width: 768px) {
      nav.confirmed-nav {
        padding: 12px 20px;
      }
    }
    .confirmed-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px 20px;
      box-sizing: border-box;
      overflow: hidden;
    }
    .confirmed-card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 24px 24px;
      max-width: 440px;
      width: 100%;
      text-align: center;
      box-shadow: 0 15px 45px rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(12px);
      box-sizing: border-box;
    }
    .icon-badge {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      background: rgba(124, 252, 0, 0.15);
      color: #7CFC00;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      margin-bottom: 12px;
      border: 2px solid rgba(124, 252, 0, 0.3);
    }
    .confirmed-card h1 {
      font-family: var(--font-header, 'Lexend', sans-serif);
      font-size: clamp(20px, 3.5vw, 25px);
      font-weight: 700;
      margin: 0 0 8px 0;
      color: #fff;
    }
    .confirmed-card p.subtitle {
      font-size: 13.5px;
      opacity: 0.85;
      line-height: 1.45;
      margin: 0 0 14px 0;
    }
    .redirect-status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(124, 252, 0, 0.12);
      border: 1px solid rgba(124, 252, 0, 0.3);
      color: #7CFC00;
      padding: 7px 14px;
      border-radius: 30px;
      font-size: 12.5px;
      font-weight: 600;
      margin-bottom: 16px;
    }
    .summary-box {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      padding: 12px 16px;
      text-align: left;
      margin-bottom: 18px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .summary-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      font-size: 13px;
    }
    .summary-item:last-child {
      border-bottom: none;
    }
    .summary-item .label {
      opacity: 0.7;
    }
    .summary-item .value {
      font-weight: 600;
      color: #7CFC00;
    }
    .action-buttons {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .btn-whatsapp {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: #25D366;
      color: #fff;
      font-weight: 700;
      padding: 13px 22px;
      border-radius: 50px;
      text-decoration: none;
      font-size: 15px;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .btn-whatsapp:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(37, 211, 102, 0.4);
    }
    .btn-home {
      display: inline-block;
      color: rgba(255, 255, 255, 0.7);
      text-decoration: none;
      font-size: 13px;
      margin-top: 4px;
      transition: color 0.2s ease;
    }
    .btn-home:hover {
      color: #fff;
    }
  </style>
</head>

<body class="confirmed-page">

  <!-- NAV HEADER -->
  <nav class="confirmed-nav">
    <a class="nav-logo brand-logo" href="index.html" style="text-decoration: none; display: inline-flex; align-items: center;">
      <span style="font-family: var(--font-header, 'Lexend', sans-serif); font-weight: 700; font-size: 24px; letter-spacing: -0.03em; color: #ffffff;">cleanse<span style="color: #7CFC00;">.ng</span></span>
    </a>
    <a href="index.html" class="btn-home" style="margin-top: 0; font-weight: 500;">Home</a>
  </nav>

  <main class="confirmed-container">
    <div class="confirmed-card">
      <div class="icon-badge">
        <i class="fa-solid fa-check"></i>
      </div>
      <h1>Booking Request Confirmed!</h1>
      <p class="subtitle">Thank you for choosing Cleanse.ng. Your cleaning plan request has been generated.</p>

      <div class="redirect-status" id="redirect-status">
        <i class="fa-solid fa-spinner fa-spin"></i> Logging your booking in...
      </div>

      <div class="summary-box" id="summary-box">
        <div class="summary-item">
          <span class="label">Plan</span>
          <span class="value" id="sum-plan">Residential Cleaning</span>
        </div>
        <div class="summary-item">
          <span class="label">Schedule</span>
          <span class="value" id="sum-visits">Scheduled Visits</span>
        </div>
        <div class="summary-item">
          <span class="label">Location</span>
          <span class="value" id="sum-location">Ibadan</span>
        </div>
      </div>

      <div class="action-buttons">
        <a href="https://wa.me/2349130663739" id="wa-confirm-btn" class="btn-whatsapp">
          <i class="fa-brands fa-whatsapp" style="font-size: 20px;"></i> Open WhatsApp Now
        </a>
        <a href="index.html" class="btn-home">Return to Homepage</a>
      </div>
    </div>
  </main>

  <script>
    (function () {
      var defaultWaNum = '2349130663739';
      var defaultMessage = "Hello Cleanse.ng! I'd like to complete my house cleaning booking.";
      var waUrl = 'https://wa.me/' + defaultWaNum + '?text=' + encodeURIComponent(defaultMessage);
      
      var lastBooking = null;
      try {
        var raw = sessionStorage.getItem('cleanse_last_booking');
        if (raw) lastBooking = JSON.parse(raw);
      } catch (e) {}

      var waBtn = document.getElementById('wa-confirm-btn');
      var planEl = document.getElementById('sum-plan');
      var visitsEl = document.getElementById('sum-visits');
      var locationEl = document.getElementById('sum-location');

      if (lastBooking) {
        if (lastBooking.plan) planEl.textContent = lastBooking.plan;
        if (lastBooking.visits) visitsEl.textContent = lastBooking.visits;
        if (lastBooking.location) locationEl.textContent = lastBooking.location;
        if (lastBooking.waUrl) {
          waUrl = lastBooking.waUrl;
        }
      }

      waBtn.href = waUrl;

      // 1-second automatic redirect to prefilled WhatsApp chat
      setTimeout(function () {
        window.location.href = waUrl;
      }, 1000);
    })();
  </script>
</body>

</html>
