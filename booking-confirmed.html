<!DOCTYPE html>
<html lang="en">

<head>
  <script>
    (function () {
      var allowed = ['cleanse.ng', 'vercel.app', 'localhost', '127.0.0.1', '::1'];
      var isLocal = window.location.protocol === 'file:';
      var host = window.location.hostname;
      var isAllowed = allowed.some(function (d) { return host === d || host.endsWith('.' + d); });
      if (isLocal || (host && !isAllowed)) {
        document.documentElement.style.display = 'none';
        window.location.href = 'https://cleanse.ng';
      }
    })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Booking Confirmed — Cleanse.ng</title>
  <meta name="description" content="Thank you for booking with Cleanse.ng! Your residential cleaning plan request has been received.">
  <meta name="robots" content="noindex, follow">
  
  <link rel="canonical" href="https://cleanse.ng/booking-confirmed.html">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&family=Nunito:ital,wght@0,300;0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./index.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    .confirmed-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--dark-purple, #0F0919);
      color: #fff;
    }
    .confirmed-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 120px 24px 60px;
    }
    .confirmed-card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 48px 36px;
      max-width: 560px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(12px);
    }
    .icon-badge {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: rgba(124, 252, 0, 0.15);
      color: #7CFC00;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 38px;
      margin-bottom: 24px;
      border: 2px solid rgba(124, 252, 0, 0.3);
    }
    .confirmed-card h1 {
      font-family: var(--font-header, 'Lexend', sans-serif);
      font-size: clamp(26px, 4vw, 36px);
      font-weight: 700;
      margin-bottom: 12px;
      color: #fff;
    }
    .confirmed-card p.subtitle {
      font-size: 16px;
      opacity: 0.85;
      line-height: 1.6;
      margin-bottom: 32px;
    }
    .summary-box {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 16px;
      padding: 20px 24px;
      text-align: left;
      margin-bottom: 32px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .summary-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      font-size: 14px;
    }
    .summary-item:last-child {
      border-bottom: none;
    }
    .summary-item .label {
      opacity: 0.7;
    }
    .summary-item .value {
      font-weight: 600;
      color: #7CFC00;
    }
    .action-buttons {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .btn-whatsapp {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: #25D366;
      color: #fff;
      font-weight: 700;
      padding: 16px 28px;
      border-radius: 50px;
      text-decoration: none;
      font-size: 16px;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .btn-whatsapp:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(37, 211, 102, 0.4);
    }
    .btn-home {
      display: inline-block;
      color: rgba(255, 255, 255, 0.7);
      text-decoration: none;
      font-size: 14px;
      margin-top: 8px;
      transition: color 0.2s ease;
    }
    .btn-home:hover {
      color: #fff;
    }
  </style>
</head>

<body class="confirmed-page">

  <!-- NAV -->
  <nav style="position: absolute; top: 0; left: 0; right: 0; width: 100%; z-index: 100;">
    <a class="nav-logo brand-logo" href="index.html" style="text-decoration: none;">
      <span style="font-family: var(--font-header); font-weight: 700; font-size: 24px; letter-spacing: -0.03em; color: #fff;">cleanse<span style="color: #7CFC00;">.ng</span></span>
    </a>
  </nav>

  <main class="confirmed-container">
    <div class="confirmed-card">
      <div class="icon-badge">
        <i class="fa-solid fa-check"></i>
      </div>
      <h1>Booking Request Confirmed!</h1>
      <p class="subtitle">Thank you for choosing Cleanse.ng. Your booking request has been generated and is ready to complete on WhatsApp.</p>

      <div class="summary-box" id="summary-box">
        <div class="summary-item">
          <span class="label">Plan</span>
          <span class="value" id="sum-plan">Residential Cleaning</span>
        </div>
        <div class="summary-item">
          <span class="label">Schedule</span>
          <span class="value" id="sum-visits">Scheduled Visits</span>
        </div>
        <div class="summary-item">
          <span class="label">Location</span>
          <span class="value" id="sum-location">Ibadan</span>
        </div>
      </div>

      <div class="action-buttons">
        <a href="https://wa.me/2349130663739" id="wa-confirm-btn" target="_blank" class="btn-whatsapp">
          <i class="fa-brands fa-whatsapp" style="font-size: 22px;"></i> Open WhatsApp Chat
        </a>
        <a href="index.html" class="btn-home">Return to Homepage</a>
      </div>
    </div>
  </main>

  <script>
    (function () {
      var defaultWaNum = '2349130663739';
      var lastBooking = null;
      try {
        var raw = sessionStorage.getItem('cleanse_last_booking');
        if (raw) lastBooking = JSON.parse(raw);
      } catch (e) {}

      var waBtn = document.getElementById('wa-confirm-btn');
      var planEl = document.getElementById('sum-plan');
      var visitsEl = document.getElementById('sum-visits');
      var locationEl = document.getElementById('sum-location');

      if (lastBooking) {
        if (lastBooking.plan) planEl.textContent = lastBooking.plan;
        if (lastBooking.visits) visitsEl.textContent = lastBooking.visits;
        if (lastBooking.location) locationEl.textContent = lastBooking.location;
        if (lastBooking.waUrl) {
          waBtn.href = lastBooking.waUrl;
          // Auto trigger window.open once if available
          try {
            window.open(lastBooking.waUrl, '_blank');
          } catch (e) {}
        }
      }
    })();
  </script>
</body>

</html>
